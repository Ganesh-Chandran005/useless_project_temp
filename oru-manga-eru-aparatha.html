<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alamban Maanga Parikkal | Kerala Slingshot Game</title>
<meta name="description" content="Pull the stone, aim for a mango, and enjoy a mischievous Kerala childhood surprise." />
<meta property="og:title" content="Alamban Maanga Parikkal" />
<meta property="og:description" content="A nostalgic Kerala mango-picking slingshot game with a mischievous twist." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<style>
:root {
  --sky: #87CEEB;
  --impact: oklch(0.64 0.24 27);
  --foreground: oklch(0.23 0.07 86);
  --primary: oklch(0.49 0.14 47);
  --paper: oklch(0.98 0.04 93);
  --border: oklch(0.39 0.1 57);
  --wood: oklch(0.45 0.12 55);
  --wood-dark: oklch(0.32 0.08 49);
  --rubber: oklch(0.51 0.22 29);
  --grass: oklch(0.69 0.18 135);
  --grass-dark: oklch(0.49 0.14 137);
  --sun: oklch(0.88 0.18 91);
  --shadow: oklch(0.25 0.06 48 / 24%);
  --crack: oklch(0.98 0 0 / 86%);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--sky);
  color: var(--foreground);
  font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
}
button { font: inherit; }

.game-shell {
  position: relative;
  min-height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  background: var(--sky);
  transition: background-color 80ms linear;
}
.game-shell.is-impact { background: var(--impact); }

.game-title {
  position: absolute;
  z-index: 20;
  top: clamp(16px, 3vh, 30px);
  left: 50%;
  width: min(92vw, 550px);
  transform: translateX(-50%) rotate(-1deg);
  padding: 13px 24px 11px;
  border: 3px solid var(--border);
  border-radius: 8px;
  background: var(--paper);
  box-shadow: 6px 7px 0 var(--shadow);
  text-align: center;
}
.game-title h1 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 0;
  font-size: clamp(1.4rem, 4vw, 2.25rem);
  line-height: 1.1;
}
.title-mango { width: 1.15em; height: 1.15em; }
.game-title p {
  margin: 5px 0 0;
  color: var(--primary);
  font-size: clamp(0.95rem, 2vw, 1.15rem);
  font-weight: 800;
}

.game-stage { position: absolute; inset: 0 0 9vh; }

.sun {
  position: absolute;
  top: 12%;
  right: 42%;
  width: clamp(55px, 7vw, 90px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--sun);
  box-shadow: 0 0 0 12px color-mix(in oklch, var(--sun), transparent 68%);
}
.cloud {
  position: absolute;
  width: clamp(68px, 9vw, 120px);
  height: clamp(24px, 3vw, 42px);
  border-radius: 999px;
  background: color-mix(in oklch, var(--paper), transparent 18%);
  box-shadow: 0 5px 0 color-mix(in oklch, var(--sky), var(--foreground) 8%);
}
.cloud::before, .cloud::after {
  content: "";
  position: absolute;
  bottom: 5px;
  border-radius: 50%;
  background: inherit;
}
.cloud::before { left: 15%; width: 43%; aspect-ratio: 1; }
.cloud::after { right: 12%; width: 34%; aspect-ratio: 1; }
.cloud-one { top: 18%; left: 34%; }
.cloud-two { top: 34%; left: 7%; transform: scale(.72); }

.rubber-bands {
  position: absolute;
  z-index: 7;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.rubber-band {
  stroke: var(--rubber);
  stroke-width: 7;
  stroke-linecap: round;
  filter: drop-shadow(0 2px 0 var(--shadow));
}

.slingshot-area {
  position: absolute;
  z-index: 5;
  left: clamp(70px, 16vw, 245px);
  bottom: 9%;
  width: 150px;
  height: 260px;
}
.slingshot { position: relative; width: 100%; height: 100%; }
.slingshot-hand {
  position: absolute;
  z-index: 12;
  top: 66px;
  left: 50%;
  width: 190px;
  height: auto;
  max-width: none;
  transform: translateX(-50%);
  pointer-events: none;
  filter: drop-shadow(5px 7px 0 var(--shadow));
}
.prong, .sling-handle, .sling-joint {
  position: absolute;
  border: 4px solid var(--wood-dark);
  background: var(--wood);
  box-shadow: inset 5px 0 0 color-mix(in oklch, var(--wood), var(--paper) 18%), 5px 5px 0 var(--shadow);
}
.prong {
  z-index: 9;
  top: 23px;
  width: 31px;
  height: 118px;
  border-radius: 18px 18px 10px 10px;
  transform-origin: bottom center;
}
.prong-left { left: 25px; transform: rotate(-24deg); }
.prong-right { right: 25px; transform: rotate(24deg); }
.sling-joint {
  z-index: 4;
  top: 112px;
  left: 50%;
  width: 53px;
  height: 52px;
  border-radius: 50%;
  transform: translateX(-50%);
}
.sling-handle {
  top: 133px;
  left: 50%;
  width: 45px;
  height: 125px;
  border-radius: 9px 9px 19px 19px;
  transform: translateX(-50%) rotate(3deg);
}

.tree-area {
  position: absolute;
  z-index: 3;
  right: clamp(-70px, 1vw, 24px);
  bottom: -2%;
  width: min(48vw, 600px);
  height: min(72vh, 690px);
}
.tree {
  position: absolute;
  right: 0;
  bottom: 0;
  width: clamp(340px, 46vw, 610px);
  height: auto;
  filter: drop-shadow(10px 12px 0 var(--shadow));
}
.mango {
  position: absolute;
  z-index: 4;
  width: clamp(38px, 5vw, 72px);
  height: auto;
  filter: drop-shadow(3px 4px 0 var(--shadow));
  animation: mango-sway 2.6s ease-in-out infinite alternate;
}
.mango-one { top: 18%; left: 28%; }
.mango-two { top: 30%; right: 17%; animation-delay: -0.8s; }
.mango-three { top: 41%; left: 17%; animation-delay: -1.4s; }
.mango-four { top: 52%; right: 28%; animation-delay: -2s; }
.mango-five { top: 62%; left: 38%; animation-delay: -0.3s; }

.stone {
  position: absolute;
  z-index: 12;
  width: 62px;
  height: 62px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  cursor: grab;
  touch-action: none;
  filter: drop-shadow(4px 6px 0 var(--shadow));
  transform-origin: center;
  will-change: left, top, transform;
}
.stone img { width: 54px; height: 54px; pointer-events: none; }
.stone:active { cursor: grabbing; }
.stone:focus-visible { outline: 4px solid var(--paper); outline-offset: 5px; }
.stone-impact {
  z-index: 80;
  transform: rotate(225deg) scale(60);
  transition: transform 80ms cubic-bezier(.82,0,1,.55);
  filter: none;
}

.ground {
  position: absolute;
  z-index: 2;
  left: -2%;
  right: -2%;
  bottom: -3%;
  height: 14vh;
  border-top: 7px solid var(--grass-dark);
  background: var(--grass);
  transform: rotate(-0.5deg);
}

.impact-layer {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: grid;
  place-items: center;
  animation: impact-flash 100ms steps(2, end) both, impact-shake 180ms 80ms ease-out both;
}
.css-crack { position: absolute; inset: 0; pointer-events: none; }
.css-crack::before {
  content: "";
  position: absolute;
  top: 48%;
  left: 50%;
  width: 46px;
  aspect-ratio: 1;
  border: 7px solid var(--crack);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px var(--foreground);
}
.css-crack i {
  position: absolute;
  top: 48%;
  left: 50%;
  width: 72vw;
  height: 5px;
  background: var(--crack);
  box-shadow: 0 0 5px var(--foreground);
  transform-origin: left center;
  clip-path: polygon(0 0, 15% 70%, 28% 5%, 43% 80%, 57% 10%, 72% 90%, 100% 30%, 100% 100%, 0 100%);
}
.css-crack i:nth-child(1) { transform: rotate(5deg); }
.css-crack i:nth-child(2) { transform: rotate(49deg); }
.css-crack i:nth-child(3) { transform: rotate(94deg); }
.css-crack i:nth-child(4) { transform: rotate(139deg); }
.css-crack i:nth-child(5) { transform: rotate(184deg); }
.css-crack i:nth-child(6) { transform: rotate(229deg); }
.css-crack i:nth-child(7) { transform: rotate(274deg); }
.css-crack i:nth-child(8) { transform: rotate(319deg); }

.reset-button {
  position: absolute;
  z-index: 4;
  bottom: clamp(32px, 8vh, 84px);
  display: inline-flex;
  align-items: center;
  padding: 15px 24px;
  border: 3px solid var(--border);
  border-radius: 8px;
  background: var(--paper);
  color: var(--foreground);
  box-shadow: 6px 7px 0 var(--shadow);
  font-weight: 900;
  font-size: clamp(1rem, 2.5vw, 1.35rem);
  cursor: pointer;
  animation: reset-arrive 260ms 420ms ease-out both;
}
.reset-button img { width: 1.15em; height: 1.15em; margin-left: 4px; }
.reset-button:hover { transform: translateY(-2px); box-shadow: 8px 9px 0 var(--shadow); }
.reset-button:active { transform: translateY(3px); box-shadow: 2px 3px 0 var(--shadow); }

@keyframes mango-sway { to { transform: rotate(8deg) translateY(4px); } }
@keyframes impact-flash { from { background: var(--paper); } to { background: color-mix(in oklch, var(--impact), transparent 22%); } }
@keyframes impact-shake {
  0%, 100% { transform: translate(0); }
  25% { transform: translate(-9px, 5px); }
  50% { transform: translate(7px, -5px); }
  75% { transform: translate(-4px, 3px); }
}
@keyframes reset-arrive { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 700px) {
  .game-stage { inset-bottom: 7vh; }
  .slingshot-area { left: 14px; bottom: 5%; transform: scale(.72); transform-origin: bottom left; }
  .tree-area { right: -52px; bottom: 1%; width: 64vw; height: 57vh; }
  .tree { width: clamp(310px, 76vw, 480px); }
  .mango { width: clamp(34px, 10vw, 54px); }
  .cloud-one { left: 24%; }
  .cloud-two { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .mango { animation: none; }
}
</style>
</head>

<script>
(function () {
  var shell = document.getElementById("shell");
  var stage = document.getElementById("stage");
  var stone = document.getElementById("stone");
  var prongLeft = document.getElementById("prongLeft");
  var prongRight = document.getElementById("prongRight");
  var bandLeft = document.getElementById("bandLeft");
  var bandRight = document.getElementById("bandRight");
  var audio = document.getElementById("scare");

  var phase = "ready"; // ready | dragging | flying | suspense | striking | impact
  var drag = null;
  var flight = null;
  var audioGraph = null;
  var timers = [];

  function isCoarse() { return window.matchMedia("(pointer: coarse)").matches; }

  function updateBands() {
    var stageBox = stage.getBoundingClientRect();
    var stoneBox = stone.getBoundingClientRect();
    var lBox = prongLeft.getBoundingClientRect();
    var rBox = prongRight.getBoundingClientRect();
    var sx = stoneBox.left + stoneBox.width / 2 - stageBox.left;
    var sy = stoneBox.top + stoneBox.height / 2 - stageBox.top;
    bandLeft.setAttribute("x1", lBox.left + lBox.width / 2 - stageBox.left);
    bandLeft.setAttribute("y1", lBox.top + 7 - stageBox.top);
    bandLeft.setAttribute("x2", sx);
    bandLeft.setAttribute("y2", sy);
    bandRight.setAttribute("x1", rBox.left + rBox.width / 2 - stageBox.left);
    bandRight.setAttribute("y1", rBox.top + 7 - stageBox.top);
    bandRight.setAttribute("x2", sx);
    bandRight.setAttribute("y2", sy);
  }

  function positionStone() {
    var stageBox = stage.getBoundingClientRect();
    var lBox = prongLeft.getBoundingClientRect();
    var rBox = prongRight.getBoundingClientRect();
    var cx = (lBox.left + rBox.right) / 2 - stageBox.left;
    var cy = Math.min(lBox.top, rBox.top) + 20 - stageBox.top;
    stone.style.left = (cx - stone.offsetWidth / 2) + "px";
    stone.style.top = (cy - stone.offsetHeight / 2) + "px";
    updateBands();
  }

  positionStone();
  window.addEventListener("resize", positionStone);
  (function loop() { updateBands(); requestAnimationFrame(loop); })();

  function setupAudio() {
    if (audioGraph) return;
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var src = ctx.createMediaElementSource(audio);
      var gain = ctx.createGain();
      gain.gain.value = isCoarse() ? 2.5 : 1.35;
      src.connect(gain);
      gain.connect(ctx.destination);
      audioGraph = { context: ctx, gain: gain };
      ctx.resume();
    } catch (e) { audio.volume = 1; }
  }

  stone.addEventListener("pointerdown", function (e) {
    if (phase !== "ready") return;
    stone.setPointerCapture(e.pointerId);
    drag = { px: e.clientX, py: e.clientY, sx: stone.offsetLeft, sy: stone.offsetTop };
    phase = "dragging";
    setupAudio();
  });

  stone.addEventListener("pointermove", function (e) {
    if (phase !== "dragging" || !drag) return;
    var dx = e.clientX - drag.px, dy = e.clientY - drag.py;
    var dist = Math.hypot(dx, dy);
    if (dist > 150) { dx = dx / dist * 150; dy = dy / dist * 150; }
    stone.style.left = (drag.sx + dx) + "px";
    stone.style.top = (drag.sy + dy) + "px";
  });

  function release() {
    if (phase !== "dragging") return;
    drag = null;
    var stageBox = stage.getBoundingClientRect();
    var targetX = stageBox.width * (window.innerWidth < 700 ? 0.67 : 0.76);
    var targetY = stageBox.height * 0.38;
    var startX = stone.offsetLeft, startY = stone.offsetTop;
    flight = stone.animate(
      [
        { left: startX + "px", top: startY + "px", transform: "rotate(0deg) scale(1)" },
        {
          left: (startX + (targetX - startX) * 0.48) + "px",
          top: (Math.min(startY, targetY) - Math.min(150, stageBox.height * 0.16)) + "px",
          transform: "rotate(155deg) scale(.86)",
          offset: 0.48
        },
        { left: targetX + "px", top: targetY + "px", transform: "rotate(320deg) scale(.72)" }
      ],
      { duration: 1200, easing: "cubic-bezier(.22,.68,.24,1)", fill: "forwards" }
    );
    phase = "flying";

    timers.push(setTimeout(function () {
      var box = stone.getBoundingClientRect();
      if (flight) { flight.pause(); flight.cancel(); }
      stone.style.left = (box.left - stageBox.left) + "px";
      stone.style.top = (box.top - stageBox.top) + "px";
      stone.style.transform = "rotate(210deg) scale(.8)";
      phase = "suspense";
    }, 800));

    timers.push(setTimeout(function () {
      phase = "striking";
      stone.style.transform = "";
      stone.classList.add("stone-impact");
    }, 950));
  }
  stone.addEventListener("pointerup", release);
  stone.addEventListener("pointercancel", release);

  stone.addEventListener("transitionend", function (e) {
    if (phase !== "striking" || e.propertyName !== "transform") return;
    phase = "impact";
    shell.classList.add("is-impact");

    var layer = document.createElement("div");
    layer.className = "impact-layer";
